[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-phal-plugin-browser"
version = "0.1.0a7"
description = "OpenVoiceOS PHAL plugin: the browser tab as the device (volume, location, power, sensors, camera)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
maintainers = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "plugin", "phal", "browser", "volume", "geolocation", "pyodide", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Environment :: WebAssembly :: Emscripten",
]
dependencies = [
    "ovos-plugin-manager>=0.0.26",
    "ovos-utils>=0.0.38",
    "ovos-bus-client>=0.0.8",
    "ovos-config>=0.0.12",
    "json-database>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-phal-plugin-browser"
Issues = "https://github.com/emkay-voice/ovos-phal-plugin-browser/issues"
Emkay = "https://github.com/emkay-voice/emkay"

[project.entry-points."opm.phal"]
ovos-phal-plugin-browser = "ovos_phal_plugin_browser:BrowserPHAL"

[tool.setuptools]
packages = ["ovos_phal_plugin_browser"]

# controlpanel.json is the plugin's page in ovos-control-panel
[tool.setuptools.package-data]
ovos_phal_plugin_browser = ["controlpanel.json", "locale/*/controlpanel.json"]
